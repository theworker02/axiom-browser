<!DOCTYPE html>
<title>Inline SVG</title>
<style>
  body { margin: 0; color: #008000; }
  /* Icon libraries color their glyphs through the text color. */
  .icon { fill: currentColor; display: block; }
  .blue { color: #0000ff; }
  .hidden { display: none; }
</style>
<!-- Left column: a green icon (fill from the page color), a blue icon (fill from its own
     color), then a 20px icon whose stroke-only path draws a black frame. A hidden icon
     (red) and a script inside an icon never paint. -->
<svg class="icon" width="20" height="20" viewBox="0 0 16 16"><path d="M0 0h16v16H0z"></path></svg>
<svg class="icon blue" width="20" height="20" viewBox="0 0 16 16"><path d="M0 0h16v16H0z"></path></svg>
<svg class="icon hidden" width="20" height="20"><rect width="20" height="20" fill="#ff0000"></rect></svg>
<svg style="display: block" width="40" height="20">
  <script>document.body.style.background = "red";</script>
  <rect x="1" y="1" width="18" height="18" fill="none" stroke="#000000" stroke-width="2"></rect>
  <rect x="20" width="20" height="20" style="fill: #ffff00"></rect>
</svg>
