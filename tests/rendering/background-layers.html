<!doctype html>
<html>
<head>
<title>Background and mask layers</title>
<style>
  body { margin: 0; }
  div { height: 20px; }
  .gradient { width: 100px; background: linear-gradient(to right, red, blue); }
  .masked {
    width: 20px;
    background: green;
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='10' height='20'/></svg>") no-repeat 0 0 / 100% 100%;
  }
  .tiled {
    width: 40px;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><rect width='5' height='10' fill='red'/></svg>") 0 0 / 10px 10px, yellow;
  }
  .layered { width: 40px; background: linear-gradient(blue, blue) right / 10px 100% no-repeat, lime; }
  .clipped {
    box-sizing: border-box;
    width: 40px;
    padding: 5px;
    background: aqua content-box;
  }
</style>
</head>
<body>
<div class="gradient"></div>
<div class="masked"></div>
<div class="tiled"></div>
<div class="layered"></div>
<div class="clipped"></div>
</body>
</html>
