<!DOCTYPE html>
<!-- The classic Google home page form: <center> centers the table, whose two 25%
     columns leave the middle column half of a shrink-to-fit table 80px wide. -->
<style>
  body { margin: 0 }
  i { display: block; width: 40px; height: 10px; background: #0000ff }
</style>
<center>
  <table cellspacing="0" cellpadding="0">
    <tr>
      <td width="25%" style="background: #ff0000"></td>
      <td><i></i></td>
      <td width="25%" style="background: #00ff00"></td>
    </tr>
  </table>
</center>
